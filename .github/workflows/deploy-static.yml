name: Deploy Static Site via AWS CDK
on:
    push:
        branches: [main]
jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: aws-cdk
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4
            - name: Setup Node.js Runtime
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'
            - name: Install Astro Dependencies
              run: npm ci
            - name: Install CDK Dependencies
              run: npm ci --prefix cdk
            - name: Build Astro Static Site
              env:
                PUBLIC_NEWS_API_URL: ${{ vars.PUBLIC_NEWS_API_URL || 'https://as-2b62f684bea24081892fa30f44c134ca.ecs.us-east-1.on.aws/api/news' }}
              run: npm run build
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-east-1
            - name: Deploy Infrastructure & Assets with AWS CDK
              working-directory: cdk
              run: npx cdk deploy --require-approval never
