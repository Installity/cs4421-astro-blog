name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install CDK dependencies
        run: npm ci --prefix cdk --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run linting
        run: npm run lint

      - name: Run Astro checks
        run: npm run check

      - name: Run all tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Check and test CDK stack
        run: |
          npm run build --prefix cdk
          npm test --prefix cdk -- --runInBand

      - name: Synthesize AWS template
        run: cd cdk && npx cdk synth --quiet

  container:
    name: Build, test, and publish container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: astro-blog

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build Linux AMD64 image
        run: docker build --platform linux/amd64 -t astro-blog:ci .

      - name: Start container
        run: |
          docker run -d --name my-blog -p 4321:4321 \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=4321 \
            astro-blog:ci

      - name: Verify container health
        shell: bash
        run: |
          for attempt in {1..45}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' my-blog)
            if [ "$status" = "healthy" ]; then
              curl --fail --show-error http://localhost:4321/api/health
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          docker logs my-blog
          docker inspect my-blog --format '{{json .State.Health}}'
          exit 1

      - name: Authenticate to AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN || 'arn:aws:iam::873716897321:role/GitHubActionsAstroECR' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag astro-blog:ci "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "Published image: ${IMAGE_URI}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove test container
        if: always()
        run: docker rm -f my-blog || true
