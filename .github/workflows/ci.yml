name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Allow main deployments to finish; cancel superseded PR checks only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install CDK dependencies
        run: npm ci --prefix cdk --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run linting
        run: npm run lint

      - name: Run Astro checks
        run: npm run check

      - name: Run all tests
        run: npm test

      - name: Test ECS deployment logic
        run: python3 -m unittest discover -s deployment -p 'test_*.py'

      - name: Build production site
        run: npm run build

      - name: Check and test CDK stack
        run: |
          npm run build --prefix cdk
          npm test --prefix cdk -- --runInBand

      - name: Synthesize AWS template
        run: cd cdk && npx cdk synth --quiet

  container:
    name: Build, test, and publish container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: astro-blog

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build Linux AMD64 image
        run: docker build --platform linux/amd64 -t astro-blog:ci .

      - name: Start container
        run: |
          docker run -d --name my-blog -p 4321:4321 \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=4321 \
            astro-blog:ci

      - name: Verify container health
        shell: bash
        run: |
          for attempt in {1..45}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' my-blog)
            if [ "$status" = "healthy" ]; then
              curl --fail --show-error http://localhost:4321/api/health
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          docker logs my-blog
          docker inspect my-blog --format '{{json .State.Health}}'
          exit 1

      - name: Authenticate to AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN || 'arn:aws:iam::873716897321:role/GitHubActionsAstroECR' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push tested image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag astro-blog:ci "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "Published image: ${IMAGE_URI}" >> "$GITHUB_STEP_SUMMARY"
          IMAGE_DIGEST=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" --query 'images[0].imageId.imageDigest' --output text)
          [[ "$IMAGE_DIGEST" == sha256:* ]]
          echo "image_uri=${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Remove test container
        if: always()
        run: docker rm -f my-blog || true

  deploy-ecs:
    name: Deploy and verify ECS site
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECS_SERVICE_ARN: arn:aws:ecs:us-east-1:873716897321:service/default/astro-blog
      NEWS_ALLOWED_ORIGINS: https://d2lpj15qx37gqq.cloudfront.net
      ECS_APPLICATION_URL: https://as-2b62f684bea24081892fa30f44c134ca.ecs.us-east-1.on.aws
      IMAGE_URI: ${{ needs.container.outputs.image_uri }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN || 'arn:aws:iam::873716897321:role/GitHubActionsAstroECR' }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update ECS and wait for healthy deployment
        run: python3 deployment/deploy_ecs.py
      - name: Verify application and news API
        run: |
          curl --fail --show-error --retry 3 "${ECS_APPLICATION_URL}/api/health"
          curl --fail --show-error --retry 3 \
            -D /tmp/news.headers \
            -H "Origin: ${NEWS_ALLOWED_ORIGINS}" \
            "${ECS_APPLICATION_URL}/api/news" -o /tmp/news.json
          python3 -c 'import json; data=json.load(open("/tmp/news.json")); assert data["items"], "News API returned no headlines"'
          python3 -c 'import os; headers=open("/tmp/news.headers").read().lower(); assert "access-control-allow-origin: " + os.environ["NEWS_ALLOWED_ORIGINS"].lower() in headers, "Missing CloudFront CORS header"'
          echo "Deployed ${IMAGE_URI} to ${ECS_APPLICATION_URL}" >> "$GITHUB_STEP_SUMMARY"
